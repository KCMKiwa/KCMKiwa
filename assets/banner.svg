    <line x1="95" y1="-40" x2="89" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.4s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.4s" begin="-0.9s" repeatCount="indefinite"/></line>
    <line x1="160" y1="-40" x2="154" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.0s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.0s" begin="-0.5s" repeatCount="indefinite"/></line>
    <line x1="225" y1="-40" x2="219" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/></line>
    <line x1="290" y1="-40" x2="284" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/></line>
    <line x1="355" y1="-40" x2="349" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.5s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.5s" begin="-0.7s" repeatCount="indefinite"/></line>
    <line x1="420" y1="-40" x2="414" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.1s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.1s" begin="-1.3s" repeatCount="indefinite"/></line>
    <line x1="485" y1="-40" x2="479" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.3s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.3s" begin="-0.4s" repeatCount="indefinite"/></line>
