  </g>

  <g class="drop" stroke="#c1121f" stroke-width="2" opacity="0.22">
    <line x1="60" y1="-60" x2="54" y2="-30"><animate attributeName="y1" values="-60;1600" dur="1.7s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="-30;1630" dur="1.7s" begin="-0.9s" repeatCount="indefinite"/></line>
