<svg width="900" height="1180" viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg">
  <title>Aaron — Application Developer, Switzerland</title>
  <desc>
    Aaron. Application Developer, Switzerland, working best after dark.
    Stack: React, TypeScript, Angular, Next.js, Tailwind, HTML, CSS,
    Java, Spring Boot, Node.js, MongoDB, MySQL, H2, GitHub, Git, Docker, Linux, VS Code.
    Mission: learn, build, break, fix, repeat. Keep building.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#c1121f" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c1121f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c1121f" stop-opacity="0"/>
    </radialGradient>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="icoFrontend" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="2" width="14" height="9" rx="1"/>
      <line x1="8" y1="11" x2="8" y2="13"/>
      <line x1="5" y1="13" x2="11" y2="13"/>
    </g>
    <g id="icoBackend" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6"/>
      <circle cx="8" cy="8" r="2.2"/>
    </g>
    <g id="icoData" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="8" cy="4" rx="6" ry="2.2"/>
      <path d="M2,4 v7 a6,2.2 0 0,0 12,0 v-7"/>
    </g>
    <g id="icoArsenal" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="4.5" cy="4.5" r="2.8"/>
      <line x1="6.5" y1="6.5" x2="13" y2="13"/>
    </g>

    <style>
      .title   { font: 700 46px monospace; fill: #f2f2f2; letter-spacing: 6px; text-anchor: middle; }
      .sub     { font: 400 16px monospace; fill: #b5b5b5; text-anchor: middle; }
      .pillTxt { font: 700 13px monospace; fill: #0a0a0a; letter-spacing: 3px; text-anchor: middle; }
      .h2      { font: 700 20px monospace; fill: #c1121f; letter-spacing: 4px; text-anchor: middle; }
      .label   { font: 700 11px monospace; fill: #7a7a7a; letter-spacing: 3px; text-anchor: middle; }
      .panelTxt{ font: 400 14px monospace; fill: #d0d0d0; }
      .panelKey{ font: 700 14px monospace; fill: #c1121f; }
      .chipTxt { font: 600 13px monospace; fill: #e8e8e8; }
      .sign    { font: 700 14px monospace; fill: #7a7a7a; letter-spacing: 2px; text-anchor: middle; }
      .bar     { fill: #1a1a1a; }
      .barFill { fill: #c1121f; }
      .drop    { stroke-linecap: round; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="1180" fill="url(#bg)"/>
  <rect width="900" height="1180" fill="url(#glow)"/>

  <!-- header -->
  <text x="450" y="110" class="title" filter="url(#textGlow)">AARON</text>
  <text x="450" y="145" class="sub">Application Developer · Switzerland · Working best after dark</text>

  <line x1="60" y1="180" x2="840" y2="180" stroke="#2b2b2b" stroke-width="1"/>

  <!-- system panel -->
  <rect x="150" y="205" width="600" height="170" rx="6" fill="#0d0d0d" stroke="#c1121f" stroke-width="1" opacity="0.9"/>
  <line x1="150" y1="241" x2="750" y2="241" stroke="#2b2b2b"/>
  <text x="175" y="231" class="panelTxt" font-weight="700" fill="#f2f2f2">SYSTEM ONLINE</text>
  <text x="175" y="267" class="panelTxt"><tspan class="panelKey">Identity  </tspan> Aaron</text>
  <text x="175" y="291" class="panelTxt"><tspan class="panelKey">Location  </tspan> HIDDEN</text>
  <text x="175" y="315" class="panelTxt"><tspan class="panelKey">Role      </tspan> Application Developer</text>
  <text x="175" y="339" class="panelTxt"><tspan class="panelKey">Status    </tspan> Building</text>
  <text x="175" y="363" class="panelTxt"><tspan class="panelKey">Mission   </tspan> Unknown</text>

  <!-- stack -->
  <text x="450" y="425" class="h2">THE STACK</text>

  <text x="450" y="461" class="label">FRONTEND</text>
  <g color="#c1121f">
    <rect x="100" y="475" width="80" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="109" y="483" width="14" height="14"/><text x="129" y="495" class="chipTxt">React</text>
    <rect x="190" y="475" width="116" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="199" y="483" width="14" height="14"/><text x="219" y="495" class="chipTxt">TypeScript</text>
    <rect x="316" y="475" width="98" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="325" y="483" width="14" height="14"/><text x="345" y="495" class="chipTxt">Angular</text>
    <rect x="424" y="475" width="92" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="433" y="483" width="14" height="14"/><text x="453" y="495" class="chipTxt">Next.js</text>
    <rect x="526" y="475" width="106" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="535" y="483" width="14" height="14"/><text x="555" y="495" class="chipTxt">Tailwind</text>
    <rect x="642" y="475" width="78" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="651" y="483" width="14" height="14"/><text x="671" y="495" class="chipTxt">HTML</text>
    <rect x="730" y="475" width="70" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoFrontend" x="739" y="483" width="14" height="14"/><text x="759" y="495" class="chipTxt">CSS</text>
  </g>

  <text x="450" y="541" class="label">BACKEND</text>
  <g color="#8a8a8a">
    <rect x="292" y="555" width="70" height="30" rx="15" fill="#0d0d0d" stroke="#8a8a8a"/><use href="#icoBackend" x="301" y="563" width="14" height="14"/><text x="321" y="575" class="chipTxt">Java</text>
    <rect x="372" y="555" width="130" height="30" rx="15" fill="#0d0d0d" stroke="#8a8a8a"/><use href="#icoBackend" x="381" y="563" width="14" height="14"/><text x="401" y="575" class="chipTxt">Spring Boot</text>
    <rect x="512" y="555" width="96" height="30" rx="15" fill="#0d0d0d" stroke="#8a8a8a"/><use href="#icoBackend" x="521" y="563" width="14" height="14"/><text x="541" y="575" class="chipTxt">Node.js</text>
  </g>

  <text x="450" y="621" class="label">DATA</text>
  <g color="#c1121f">
    <rect x="311" y="635" width="112" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoData" x="320" y="643" width="14" height="14"/><text x="340" y="655" class="chipTxt">MongoDB</text>
    <rect x="433" y="635" width="86" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoData" x="442" y="643" width="14" height="14"/><text x="462" y="655" class="chipTxt">MySQL</text>
    <rect x="529" y="635" width="60" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoData" x="538" y="643" width="14" height="14"/><text x="558" y="655" class="chipTxt">H2</text>
  </g>

  <text x="450" y="701" class="label">ARSENAL</text>
  <g>
    <rect x="215" y="715" width="92" height="30" rx="15" fill="#000000" stroke="#e8e8e8"/><use href="#icoArsenal" x="224" y="723" width="14" height="14" color="#e8e8e8"/><text x="244" y="735" class="chipTxt">GitHub</text>
    <rect x="317" y="715" width="66" height="30" rx="15" fill="#c1121f" stroke="#c1121f"/><use href="#icoArsenal" x="326" y="723" width="14" height="14" color="#0a0a0a"/><text x="346" y="735" class="chipTxt" fill="#0a0a0a">Git</text>
    <rect x="393" y="715" width="94" height="30" rx="15" fill="#0d0d0d" stroke="#8a8a8a"/><use href="#icoArsenal" x="402" y="723" width="14" height="14" color="#8a8a8a"/><text x="422" y="735" class="chipTxt">Docker</text>
    <rect x="497" y="715" width="78" height="30" rx="15" fill="#0d0d0d" stroke="#8a8a8a"/><use href="#icoArsenal" x="506" y="723" width="14" height="14" color="#8a8a8a"/><text x="526" y="735" class="chipTxt">Linux</text>
    <rect x="585" y="715" width="100" height="30" rx="15" fill="#1a1a1a" stroke="#c1121f"/><use href="#icoArsenal" x="594" y="723" width="14" height="14" color="#c1121f"/><text x="614" y="735" class="chipTxt">VS Code</text>
  </g>

  <!-- currently learning -->
  <text x="450" y="801" class="h2">CURRENTLY LEARNING</text>
  <g font-family="monospace" font-size="12" fill="#a8a8a8">
    <text x="150" y="835">REACT / TYPESCRIPT</text>
    <rect x="360" y="823" width="390" height="10" class="bar"/><rect x="360" y="823" width="370" height="10" class="barFill"/>

    <text x="150" y="860">JAVA / SPRING BOOT</text>
    <rect x="360" y="848" width="390" height="10" class="bar"/><rect x="360" y="848" width="330" height="10" class="barFill"/>

    <text x="150" y="885">DOCKER / LINUX</text>
    <rect x="360" y="873" width="390" height="10" class="bar"/><rect x="360" y="873" width="250" height="10" class="barFill"/>

    <text x="150" y="910">SOFTWARE ARCHITECTURE</text>
    <rect x="360" y="898" width="390" height="10" class="bar"/><rect x="360" y="898" width="220" height="10" class="barFill"/>

    <text x="150" y="935">TESTING</text>
    <rect x="360" y="923" width="390" height="10" class="bar"/><rect x="360" y="923" width="190" height="10" class="barFill"/>
  </g>

  <!-- mission -->
  <text x="450" y="1000" class="h2">THE MISSION</text>
  <text x="450" y="1030" class="sub" letter-spacing="2">LEARN  →  BUILD  →  BREAK  →  FIX  →  REPEAT</text>
  <rect x="330" y="1048" width="240" height="34" rx="4" fill="#0d0d0d" stroke="#c1121f"/>
  <text x="450" y="1070" class="pillTxt" fill="#c1121f">KEEP BUILDING.</text>

  <line x1="60" y1="1108" x2="840" y2="1108" stroke="#2b2b2b" stroke-width="1"/>
  <text x="450" y="1138" class="sign">AARON — APPLICATION DEVELOPMENT · SOFTWARE · BUILDING</text>

