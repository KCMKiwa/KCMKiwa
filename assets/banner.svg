    <line x1="810" y1="-40" x2="804" y2="-10"><animate attributeName="y1" values="-40;1600" dur="1.05s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="-10;1630" dur="1.05s" begin="-1.2s" repeatCount="indefinite"/></line>
